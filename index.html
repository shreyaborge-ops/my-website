<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

   <nav class="navbar">

    <div class="logo">
        Employee Management System
    </div>

    <div class="nav-links">

        <a href="index.html" class="active">
            Dashboard
        </a>

        <a href="reports.html">
            Reports
        </a>

        <a href="admin.html">
            Admin
        </a>

    </div>

</nav>

    <!-- Main Content -->
    <div class="container">

        <!-- Welcome -->
        <div class="welcome">
            <h2>Dashboard</h2>
            <p>Manage your employees and company information.</p>
        </div>

        <!-- Dashboard Cards -->
        <div class="cards">

            <div class="card">
                <h3>Total Employees</h3>
                <div class="number">25</div>
            </div>

            <div class="card">
                <h3>Departments</h3>
                <div class="number">6</div>
            </div>

            <div class="card">
                <h3>Active Employees</h3>
                <div class="number">23</div>
            </div>

        </div>

        <!-- Employee Table -->
        <div class="employee-section">

            <div class="employee-header">
                <h2>Employee List</h2>

                <button class="add-btn"
    onclick="window.location.href='add-employee.html'">
    + Add Employee
</button>
            </div>

            <input
    type="text"
    id="searchInput"
    class="search"
    placeholder="Search employee..."
    onkeyup="searchEmployee()">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Position</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="employeeTable">
</tbody>

            </table>

        </div>

    </div>
<script>

    let employees = [];

    // Load employees from database
    async function loadEmployees() {

        const response = await fetch("/employees");

        employees = await response.json();

        displayEmployees(employees);
    }


    // Display employees
    function displayEmployees(data) {

        const table = document.getElementById("employeeTable");

        table.innerHTML = "";

        data.forEach(employee => {

            const row = `
                <tr>

                    <td>${employee.employee_id}</td>

                    <td>${employee.name}</td>

                    <td>${employee.email}</td>

                    <td>${employee.department}</td>

                    <td>${employee.position}</td>

                    <td>
                        <button class="action-btn edit" onclick="editEmployee('${employee.employee_id}')">
    Edit
</button>

                        <button class="action-btn delete"
    onclick="deleteEmployee('${employee.employee_id}')">
    Delete
</button>
                    </td>

                </tr>
            `;

            table.innerHTML += row;
        });
    }


    // Search employee
    function searchEmployee() {

        const searchText =
            document.getElementById("searchInput").value.toLowerCase();

        const filteredEmployees = employees.filter(employee =>

            employee.employee_id.toLowerCase().includes(searchText) ||

            employee.name.toLowerCase().includes(searchText) ||

            employee.department.toLowerCase().includes(searchText) ||

            employee.position.toLowerCase().includes(searchText)

        );

        displayEmployees(filteredEmployees);
    }


    // Load employees when page opens
    loadEmployees();
async function editEmployee(employeeId) {

    const employee = employees.find(
        emp => String(emp.employee_id) === String(employeeId)
    );

    if (!employee) {
        alert("Employee not found");
        return;
    }

    const name = prompt(
        "Enter new name:",
        employee.name
    );

    if (name === null || name.trim() === "") {
        return;
    }

    const response = await fetch(
        `/edit-employee/${employeeId}`,
        {
            method: "PUT",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name: name
            })
        }
    );

    const result = await response.json();

    if (response.ok) {

        alert("Employee updated successfully!");

        loadEmployees();

    } else {

        alert("Error: " + result.error);
    }
}

async function deleteEmployee(employeeId) {

    const confirmDelete = confirm(
        "Are you sure you want to delete this employee?"
    );

    if (!confirmDelete) {
        return;
    }

    const response = await fetch(
        `/delete-employee/${employeeId}`,
        {
            method: "DELETE"
        }
    );

    const result = await response.json();

    if (response.ok) {

        alert("Employee deleted successfully!");

        loadEmployees();

    } else {

        alert("Error: " + result.error);
    }
}
</script>
</body>

</html>
